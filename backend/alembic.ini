# Alembic設定ファイル。
# Alembicはデータベースマイグレーション（スキーマ変更管理）ツール。
# SQLAlchemyのモデル定義の変更を検知し、差分のマイグレーションファイルを自動生成する。

[alembic]
# マイグレーションスクリプトの場所
script_location = alembic

# SQLAlchemy URLは env.py で動的に設定するため、ここでは空にする
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
